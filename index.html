<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>याद दिलाओ · Yaad Dilao</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F7FC;--card:#fff;--ink:#12263A;--mute:#5F7487;--brand:#0B7BC1;--on:#fff;--line:#D5E5F1;--soft:#E3F1FB;--bad:#C9372C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A27;--card:#13273A;--ink:#E8F1F8;--mute:#93A9BB;--brand:#4DB3F0;--on:#06263D;--line:#244159;--soft:#1A3550;--bad:#FF8A7F}}
:root[data-theme="dark"]{--bg:#0C1A27;--card:#13273A;--ink:#E8F1F8;--mute:#93A9BB;--brand:#4DB3F0;--on:#06263D;--line:#244159;--soft:#1A3550;--bad:#FF8A7F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Hind,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 16px 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:30px;margin:0;font-weight:700;letter-spacing:-.01em}
.lang{background:var(--soft);color:var(--brand);padding:6px 14px;border-radius:99px;font-weight:700}
.sum{background:var(--brand);color:var(--on);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.sum small{opacity:.85;display:block}.sum b{font-size:34px;line-height:1.2}
.note{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--mute);margin-bottom:12px}
.note button{color:var(--brand);font-weight:700;margin-right:12px;padding:4px 0}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=time]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
h2{font-size:19px;margin:20px 0 8px;display:flex;gap:8px;align-items:center}
h2 i{font-style:normal;font-size:14px;background:var(--soft);color:var(--brand);padding:1px 10px;border-radius:99px}
.od{color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px}
.mid{text-align:left;min-width:0}.mid b{display:block;overflow-wrap:anywhere}.mid span{color:var(--mute);font-size:15px}
.amt{font-weight:700;color:var(--brand)}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:6px 12px;border-radius:99px;background:var(--soft);font-size:15px;font-weight:600}
.acts .del{color:var(--bad)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--on);font-size:34px;box-shadow:0 6px 18px #0B7BC155}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:22px}
label{display:block;font-weight:600;margin:12px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
.primary{width:100%;background:var(--brand);color:var(--on);padding:14px;border-radius:14px;font-weight:700;margin-top:18px;font-size:18px}
.ghost{width:100%;padding:12px;color:var(--mute)}
#ring{align-items:center;padding:16px}
#ring .sheet{border-radius:24px;text-align:center}
#ring .big{font-size:56px;animation:sw 1s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(18deg)}}
@media(prefers-reduced-motion:reduce){#ring .big{animation:none}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:9;max-width:90%}
</style></head><body><main>
<header><h1 id="ttl"></h1><button class="lang" id="lg"></button></header>
<div class="sum"><small id="sl"></small><b id="sv"></b></div>
<div class="note" id="nt"></div>
<input type="search" id="q">
<div class="chips" id="cats"></div>
<div id="list"></div>
</main>
<button class="fab" id="add" aria-label="+">+</button>
<div class="ov" id="frm"><div class="sheet" id="fs"></div></div>
<div class="ov" id="ring"><div class="sheet" id="rs"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CAT={bill:['बिल','Bill','🧾',205],emi:['EMI','EMI','💳',265],med:['दवा','Medicine','💊',150],ins:['बीमा','Insurance','🛡️',30],bday:['जन्मदिन','Birthday','🎂',330],other:['अन्य','Other','📌',215]};
const REP={once:['एक बार','Once'],daily:['रोज़','Daily'],weekly:['हर हफ़्ते','Weekly'],monthly:['हर महीने','Monthly'],yearly:['हर साल','Yearly']};
const ERL={0:['कोई नहीं','None'],60:['1 घंटा पहले','1 hour before'],1440:['1 दिन पहले','1 day before']};
const S={hi:{app:'याद दिलाओ',mo:'इस महीने के बिल और EMI',ph:'रिमाइंडर खोजें',all:'सभी',od:'छूटे हुए',td:'आज',up:'आगे',e1:'आज के लिए कुछ नहीं है',e2:'आने वाले रिमाइंडर यहाँ दिखेंगे',new:'नया रिमाइंडर',edit:'रिमाइंडर बदलें',what:'क्या याद रखना है?',ex:'जैसे: बिजली का बिल भरना',cat:'श्रेणी',date:'तारीख',time:'समय',rep:'दोहराएँ',early:'पहले से सूचना',amt:'रकम (₹, ज़रूरी नहीं)',save:'रिमाइंडर सेव करें',cancel:'रद्द करें',done:'✓ पूरा हुआ',snz:'⏰ टालें',del:'🗑 हटाएँ',m10:'10 मिनट',h1:'1 घंटा',tm:'कल',note:'ऐप खुला रखें तो आवाज़ के साथ याद दिलाएगा। दवा और EMI जैसी ज़रूरी चीज़ों के लिए फोन का अलार्म भी लगाएँ।',en:'सूचना चालू करें',test:'आवाज़ जाँचें',need:'पहले बताइए क्या याद रखना है',ok:'सेव हो गया',rt:'याद दिलाने का समय!',gone:'पूरा हुआ ✓',pre:'जल्दी ही:'},
en:{app:'Yaad Dilao',mo:'Bills + EMIs this month',ph:'Search reminders',all:'All',od:'Missed',td:'Today',up:'Upcoming',e1:'Nothing scheduled for today',e2:'Your upcoming reminders will appear here',new:'New reminder',edit:'Edit reminder',what:'What do you want to remember?',ex:'e.g. Pay electricity bill',cat:'Category',date:'Date',time:'Time',rep:'Repeat',early:'Early alert',amt:'Amount (₹, optional)',save:'Save reminder',cancel:'Cancel',done:'✓ Done',snz:'⏰ Snooze',del:'🗑 Delete',m10:'10 min',h1:'1 hour',tm:'Tomorrow',note:'Keep this page open to get a sound alert. For medicine and EMI, also set a phone alarm.',en:'Turn on notifications',test:'Test sound',need:'Enter what you want to remember',ok:'Saved',rt:'Time to act!',gone:'Done ✓',pre:'Coming up:'}};
let lang=ld('lang','hi'),list=ld('rem',[]),cat='all',q='',snzOpen=null,ringQ=[],bt=null,ac=null,f=null;
const t=k=>S[lang][k],ci=i=>lang==='hi'?0:1;
const when=r=>r.snooze||new Date(r.date+'T'+r.time).getTime();
const loc=()=>lang==='hi'?'hi-IN':'en-IN';
const fd=r=>new Date(r.date+'T00:00').toLocaleDateString(loc(),{day:'numeric',month:'short'})+' · '+new Date(r.date+'T'+r.time).toLocaleTimeString(loc(),{hour:'numeric',minute:'2-digit'});
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)}
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function beep(){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
function sysNote(title,body){try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}}
function render(){
 document.documentElement.lang=lang;$('#ttl').textContent=t('app');$('#lg').textContent=lang==='hi'?'अ / A  English':'अ / A  हिंदी';
 $('#sl').textContent=t('mo');$('#q').placeholder=t('ph');
 let canN=false;try{canN='Notification' in window&&Notification.permission==='default'}catch(e){}
 $('#nt').innerHTML=esc(t('note'))+'<br>'+(canN?'<button data-act="en">'+t('en')+'</button>':'')+'<button data-act="test">'+t('test')+'</button>';
 $('#cats').innerHTML=['all',...Object.keys(CAT)].map(k=>'<button class="chip'+(cat===k?' on':'')+'" data-cat="'+k+'">'+(k==='all'?t('all'):CAT[k][2]+' '+CAT[k][ci()])+'</button>').join('');
 const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),eod=sod+864e5,ym=ymd(now).slice(0,7);
 $('#sv').textContent='₹'+list.filter(r=>['bill','emi','ins'].includes(r.cat)&&r.date.slice(0,7)===ym).reduce((a,r)=>a+(+r.amt||0),0).toLocaleString('en-IN');
 const v=list.filter(r=>(cat==='all'||r.cat===cat)&&r.title.toLowerCase().includes(q)).sort((a,b)=>when(a)-when(b));
 const od=v.filter(r=>when(r)<sod),td=v.filter(r=>when(r)>=sod&&when(r)<eod),up=v.filter(r=>when(r)>=eod);
 const card=r=>{const c=CAT[r.cat]||CAT.other;return '<div class="card"><div class="ico" style="background:hsl('+c[3]+' 70% 50%/.16)">'+c[2]+'</div><button class="mid" data-act="edit" data-id="'+r.id+'"><b>'+esc(r.title)+'</b><span>'+fd(r)+(r.repeat!=='once'?' · 🔁':'')+'</span></button><div class="amt">'+(r.amt?'₹'+(+r.amt).toLocaleString('en-IN'):'')+'</div><div class="acts" data-id="'+r.id+'">'+(snzOpen===r.id?'<button data-act="s" data-m="10">'+t('m10')+'</button><button data-act="s" data-m="60">'+t('h1')+'</button><button data-act="s" data-m="tm">'+t('tm')+'</button>':'<button data-act="done">'+t('done')+'</button><button data-act="snz">'+t('snz')+'</button><button class="del" data-act="del">'+t('del')+'</button>')+'</div></div>'};
 const sec=(h,a,e,c)=>'<h2 class="'+(c||'')+'">'+h+' <i>'+a.length+'</i></h2>'+(a.length?a.map(card).join(''):'<div class="empty">'+e+'</div>');
 $('#list').innerHTML=(od.length?sec(t('od'),od,'','od'):'')+sec(t('td'),td,t('e1'))+sec(t('up'),up,t('e2'));
}
function save(){sv('rem',list)}
function advance(r){const d=new Date(r.date+'T00:00');const n=Date.now();let g=0;do{if(r.repeat==='daily')d.setDate(d.getDate()+1);else if(r.repeat==='weekly')d.setDate(d.getDate()+7);else if(r.repeat==='monthly')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);r.date=ymd(d)}while(new Date(r.date+'T'+r.time).getTime()<n&&++g<400);r.snooze=0;r.fired=0;r.pre=0}
function finish(r){if(!list.includes(r))return;if(r.repeat==='once')list=list.filter(x=>x!==r);else advance(r);save();toast(t('gone'))}
function snooze(r,m){if(m==='tm'){const d=new Date();d.setDate(d.getDate()+1);r.snooze=new Date(ymd(d)+'T'+r.time).getTime()}else r.snooze=Date.now()+m*6e4;r.fired=0;r.pre=0;save()}
function showRing(){const r=ringQ[0];if(!r){$('#ring').classList.remove('show');clearInterval(bt);bt=null;return}
 $('#rs').innerHTML='<div class="big">🔔</div><h3>'+esc(r.title)+'</h3><p>'+t('rt')+(r.amt?' ₹'+(+r.amt).toLocaleString('en-IN'):'')+'</p><button class="primary" data-act="rdone">'+t('done')+'</button><div class="wrap" style="margin-top:12px;justify-content:center"><button class="chip" data-act="rs" data-m="10">'+t('m10')+'</button><button class="chip" data-act="rs" data-m="60">'+t('h1')+'</button><button class="chip" data-act="rs" data-m="tm">'+t('tm')+'</button></div>';
 $('#ring').classList.add('show');if(!bt){beep();bt=setInterval(beep,1500)}}
function ring(r){if(!ringQ.includes(r))ringQ.push(r);sysNote(r.title,t('rt'));showRing()}
function tick(){const n=Date.now();let ch=false;for(const r of list){const w=when(r);
 if(n>=w&&r.fired!==w){r.fired=w;ch=true;ring(r)}
 else if(r.early&&!r.snooze&&n<w&&n>=w-r.early*6e4&&r.pre!==w){r.pre=w;ch=true;toast('🔔 '+t('pre')+' '+r.title);sysNote(r.title,t('pre'))}}
 if(ch){save();render()}}
function openForm(r){snzOpen=null;f=r?{...r}:{id:'r'+Date.now(),title:'',cat:'bill',date:ymd(new Date()),time:pad(new Date().getHours()+1>23?23:new Date().getHours()+1)+':00',repeat:'once',early:0,amt:'',isNew:1};
 drawForm(!!r)}
function drawForm(r){
 const ch=(g,o,cur,lab)=>'<div class="wrap">'+o.map(k=>'<button class="chip'+(String(cur)===String(k)?' on':'')+'" data-g="'+g+'" data-v="'+k+'">'+lab(k)+'</button>').join('')+'</div>';
 $('#fs').innerHTML='<h3>'+(r?t('edit'):t('new'))+'</h3><label>'+t('what')+'</label><input type="text" id="ft" value="'+esc(f.title)+'" placeholder="'+esc(t('ex'))+'"><label>'+t('cat')+'</label>'+ch('cat',Object.keys(CAT),f.cat,k=>CAT[k][2]+' '+CAT[k][ci()])+'<div class="row"><div><label>'+t('date')+'</label><input type="date" id="fdte" value="'+f.date+'"></div><div><label>'+t('time')+'</label><input type="time" id="ftm" value="'+f.time+'"></div></div><label>'+t('rep')+'</label>'+ch('repeat',Object.keys(REP),f.repeat,k=>REP[k][ci()])+'<label>'+t('early')+'</label>'+ch('early',[0,60,1440],f.early,k=>ERL[k][ci()])+'<label>'+t('amt')+'</label><input type="number" inputmode="numeric" id="fa" value="'+esc(f.amt)+'"><button class="primary" data-act="save">'+t('save')+'</button><button class="ghost" data-act="close">'+t('cancel')+'</button>';
 $('#frm').classList.add('show')}
function readForm(){f.title=$('#ft').value.trim();f.date=$('#fdte').value;f.time=$('#ftm').value;f.amt=$('#fa').value}
document.addEventListener('click',e=>{unlock();const b=e.target.closest('button');if(!b)return;
 if(b.id==='lg'){lang=lang==='hi'?'en':'hi';sv('lang',lang);render();return}
 if(b.id==='add'){openForm();return}
 if(b.dataset.cat){cat=b.dataset.cat;render();return}
 if(b.dataset.g){const sc=$('#fs').scrollTop;readForm();f[b.dataset.g]=b.dataset.g==='early'?+b.dataset.v:b.dataset.v;drawForm(!list.every(x=>x.id!==f.id));$('#fs').scrollTop=sc;return}
 const a=b.dataset.act;if(!a)return;const id=(b.closest('[data-id]')||b).dataset.id,r=list.find(x=>x.id===id);
 if(a==='edit'&&r)openForm(r);
 else if(a==='done'&&r){finish(r);render()}
 else if(a==='del'&&r){list=list.filter(x=>x!==r);save();render()}
 else if(a==='snz'){snzOpen=id;render()}
 else if(a==='s'&&r){snooze(r,b.dataset.m==='tm'?'tm':+b.dataset.m);snzOpen=null;render()}
 else if(a==='close')$('#frm').classList.remove('show');
 else if(a==='save'){readForm();if(!f.title){toast(t('need'));return}const o={...f};delete o.isNew;o.snooze=0;o.fired=0;o.pre=0;const i=list.findIndex(x=>x.id===o.id);if(i>=0)list[i]=o;else list.push(o);save();$('#frm').classList.remove('show');render();toast(t('ok'))}
 else if(a==='rdone'){const x=ringQ.shift();finish(x);showRing();render()}
 else if(a==='rs'){const x=ringQ.shift();if(list.includes(x))snooze(x,b.dataset.m==='tm'?'tm':+b.dataset.m);showRing();render()}
 else if(a==='en'){try{Notification.requestPermission().then(render)}catch(x){}}
 else if(a==='test'){ring({title:lang==='hi'?'जाँच: यह एक टेस्ट है':'Test: this is a sound check',repeat:'once',test:1})}
});
$('#q').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render()});
render();tick();setInterval(tick,10000);document.addEventListener('visibilitychange',tick);
</script></body></html>
